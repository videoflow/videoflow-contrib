# Human-tracking config template. `videoflow deploy human_tracking.py` and
# `videoflow run-local human_tracking.py` read this when no config.yaml exists:
# they ask the x-questions below, write config.yaml, and mount the x-mounts paths
# into the prep container and the worker containers or pods. See
# config.example.yaml for what every knob means.
work_dir: ./out
input_video: ''
output_video: annotated_video.avi
device: cpu
flow_type: batch
pose:
  architecture: R50_FPN_3x
encoder:
  batch_size: 32
tracker:
  min_height: 0
  max_cosine_distance: 0.2
  nn_budget: null

# Inputs asked for when generating config.yaml. input_video is deliberately
# absent: leaving it empty uses the bundled sample clip, and a user with their
# own footage sets it in config.yaml (an absolute path; it is mounted read-only).
x-questions:
  - key: work_dir
    prompt: 'Directory for the output and the sample clip (on a multi-node cluster: one every node sees, under the shared claim)'
    type: str
    default: ./out
  - key: device
    prompt: 'Run the pose and encoder models on'
    type: choice
    choices: [cpu, gpu]
    default: cpu
  - key: tracker.max_cosine_distance
    prompt: 'Appearance-match threshold (lower = stricter re-identification)'
    type: float
    default: 0.2
  - key: flow_type
    prompt: 'Flow type (batch = recorded file, realtime = live source)'
    type: choice
    choices: [batch, realtime]
    default: batch

# Paths that must be visible inside the prep container and the workers: your own
# input video (read-only; nothing when the bundled sample is used, it lives in
# work_dir), the work dir at the same absolute location (it holds the sample clip
# and the output video), plus the operator's model-weight caches mapped onto the
# container root's -- the components resolve those at runtime via ~, which is
# /root inside the container.
x-mounts:
  - '{input_video}:ro'
  - '{work_dir}'
  - '~/.videoflow:/root/.videoflow'
  - '~/.torch:/root/.torch'

# The config value that decides whether the GPU image (gpu.Dockerfile) is built.
x-gpu:
  - '{device}'
