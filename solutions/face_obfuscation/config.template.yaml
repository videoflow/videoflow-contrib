# Face-obfuscation config template. `videoflow deploy face_obfuscation.py` reads
# this when no config.yaml exists: it asks the x-questions below, writes
# config.yaml, and hostPath-mounts the x-mounts paths into the prep container and
# the worker pods. See config.example.yaml for what every knob means.
work_dir: ./out
input_video: ''
output_video: blurred_video.avi
fps: 25
device: cpu
flow_type: batch
detector:
  architecture: ssd-mobilenetv2
  dataset: faces
  num_classes: 1
  min_score_threshold: 0.1
tracker:
  max_age: 12
  min_hits: 0
blur:
  expand: 0.20
  kernel: 23
  sigma: 30

# Inputs `videoflow deploy` asks for when generating config.yaml. input_video is
# deliberately absent: leaving it empty uses the bundled sample clip, and a user
# with their own footage sets it in config.yaml (and adds a --mount for it).
x-questions:
  - key: detector.min_score_threshold
    prompt: 'Face detection threshold (lower catches more faces and more false positives)'
    type: float
    default: 0.1
  - key: blur.sigma
    prompt: 'Blur strength (Gaussian sigma; higher is blurrier)'
    type: float
    default: 30.0
  - key: device
    prompt: 'Run the detector on'
    type: choice
    choices: [cpu, gpu]
    default: cpu
  - key: flow_type
    prompt: 'Flow type (batch = recorded file, realtime = live source)'
    type: choice
    choices: [batch, realtime]
    default: batch

# Paths that must be visible inside prep containers and worker pods: the work dir
# at the same absolute location (it holds the input clip and the blurred output),
# plus the operator's model-weight cache mapped onto the container root's -- the
# detector resolves that at runtime via ~, which is /root inside the pod. Your own
# footage is not here on purpose: mount it with `--mount /path/to/video.mp4:ro`.
x-mounts:
  - '{work_dir}'
  - '~/.videoflow:/root/.videoflow'
